# App-pipeline (plan.md §8B): bygger en installerbar APK så appen går att
# testa på riktig enhet.
#
# Två vägar till en APK:
#   * `apk`-jobbet bygger lokalt på runnern med Gradle. Kräver inget konto
#     och inga secrets – APK:n hamnar som artifact på körningen.
#   * `eas`-jobbet bygger via EAS och ger en install-länk, men kräver ett
#     Expo-konto och EXPO_TOKEN. Körs bara när man ber om det.
#
# Startas manuellt eller av en v*-tagg – aldrig av vanliga pushar, så den
# drar inga Actions-minuter i onödan.
name: Bygg app

on:
  workflow_dispatch:
    inputs:
      eas:
        description: Bygg via EAS i stället för lokalt (kräver EXPO_TOKEN)
        type: boolean
        default: false
      release:
        description: Bygg en signerad AAB för Play (kräver keystore-secrets)
        type: boolean
        default: false
      profile:
        description: EAS-profil (används bara med EAS)
        type: choice
        options: [preview, production]
        default: preview
  push:
    tags: ['v*']

jobs:
  checks:
    name: Tester och typkontroll
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

  apk:
    name: APK (Gradle)
    needs: checks
    if: ${{ !inputs.eas && !inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Genererar android/ från app.json. Mappen är gitignorerad, så den
      # byggs om vid varje körning och kan aldrig hamna i otakt med configen.
      - name: Prebuild (genererar android/)
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_ALLOW_PLAINTEXT: '1'
          EXPO_PUBLIC_ALLOW_GENERATED: '1'

      # Expo-mallens release-buildType signerar med debug-nyckeln, så APK:n
      # går att installera direkt. Byt till en riktig nyckel innan release.
      - name: Bygg APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          EXPO_PUBLIC_ALLOW_PLAINTEXT: '1'
          EXPO_PUBLIC_ALLOW_GENERATED: '1'

      - name: Rapportera effektiv targetSdk
        run: |
          MANIFEST=$(find android/app/build/intermediates -name AndroidManifest.xml \
            -path "*release*" | head -1)
          echo "Merged manifest: $MANIFEST"
          grep -oE 'targetSdkVersion="[0-9]+"' "$MANIFEST" || true
          {
            echo "### Manifest"
            echo '```'
            grep -oE 'targetSdkVersion="[0-9]+"|uses-permission[^/]*' "$MANIFEST" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Döp om APK:n
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist-apk/fyrtal-${GITHUB_SHA::7}.apk"
          ls -lh dist-apk

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: fyrtal-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      - name: Publicera nedladdningslänk
        run: |
          {
            echo "## Fyrtal – installerbar APK"
            echo
            echo "[Ladda ner fyrtal-apk](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "Filen laddas ner som ett zip-arkiv. Packa upp den, flytta"
            echo "APK:n till telefonen och öppna den. Android frågar om"
            echo "tillåtelse att installera från okänd källa första gången."
            echo
            echo "Signerad med debug-nyckeln – bra nog för egen testning,"
            echo "men byt till en riktig nyckel före publicering."
          } >> "$GITHUB_STEP_SUMMARY"

  eas:
    name: EAS build (Android)
    needs: checks
    if: ${{ inputs.eas }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Kontrollera att EXPO_TOKEN finns
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN saknas. Lägg till den under Settings → Secrets → Actions, eller kör utan EAS för en Gradle-byggd APK."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Bygg APK
        id: build
        run: |
          PROFILE="${{ inputs.profile || 'preview' }}"
          echo "Bygger profilen $PROFILE"
          eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --json \
            --wait > build.json
          echo "url=$(jq -r '.[0].artifacts.buildUrl' build.json)" >> "$GITHUB_OUTPUT"

      - name: Publicera install-länk
        run: |
          {
            echo "## Fyrtal – installerbar APK (EAS)"
            echo
            echo "[Ladda ner APK](${{ steps.build.outputs.url }})"
          } >> "$GITHUB_STEP_SUMMARY"

  aab:
    name: AAB för Play (signerad)
    needs: checks
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Kontrollera att keystore-secrets finns
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 saknas. Se store/PUBLISHING.md för hur nyckeln skapas och läggs in."
            exit 1
          fi

      - run: npm ci

      # Play kräver att versionCode ökar för varje uppladdning. Körningsnumret
      # är monotont och kräver ingen commit, så det används rakt av.
      - name: Sätt versionCode till körningsnumret
        run: |
          python3 - <<'EOF'
          import json
          with open("app.json") as f:
              config = json.load(f)
          config["expo"]["android"]["versionCode"] = int("${{ github.run_number }}")
          with open("app.json", "w") as f:
              json.dump(config, f, indent=2, ensure_ascii=False)
              f.write("\n")
          EOF
          grep versionCode app.json

      - name: Prebuild (genererar android/)
        run: npx expo prebuild --platform android --no-install

      - name: Koppla in uppladdningsnyckeln
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          python3 scripts/configure-signing.py android/app/build.gradle

      - name: Bygg AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Kontrollera att AAB:n inte är debug-signerad
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          keytool -printcert -jarfile "$AAB" | tee cert.txt
          if grep -qi "CN=Android Debug" cert.txt; then
            echo "::error::AAB:n är signerad med debug-nyckeln – Play avvisar den."
            exit 1
          fi

      - name: Samla ihop
        run: |
          mkdir -p dist-aab
          cp android/app/build/outputs/bundle/release/app-release.aab \
             "dist-aab/fyrtal-${{ github.run_number }}.aab"
          ls -lh dist-aab

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: fyrtal-aab
          path: dist-aab/*.aab
          if-no-files-found: error

      - name: Publicera nedladdningslänk
        run: |
          {
            echo "## Fyrtal – AAB för Play"
            echo
            echo "[Ladda ner fyrtal-aab](${{ steps.upload.outputs.artifact-url }})"
            echo
            echo "versionCode: ${{ github.run_number }}"
            echo
            echo "Ladda upp i Play Console → Produktion → Skapa ny version."
          } >> "$GITHUB_STEP_SUMMARY"
